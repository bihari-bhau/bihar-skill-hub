# Railway / Nixpacks configuration for the Django backend.
# Nixpacks auto-detects Python and runs `pip install -r requirements.txt`.
# The migrate + collectstatic + gunicorn start command is set as the
# Railway "Start Command" (Settings → Deploy → Start Command) so that
# database migrations run on every deploy.

[variables]
NIXPACKS_NO_BUILD_SECRETS = "1"